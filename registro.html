<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Akari Store - Registro</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        :root {

            --purple-primary: #6b21a8;
            --purple-secondary: #7e22ce;
            --purple-gradient-start: #4c1d95;
            --purple-gradient-end: #3b0764;
            --purple-accent: #a855f7;

        }


        body {

            background: linear-gradient(
                135deg,
                var(--purple-gradient-start),
                var(--purple-gradient-end)
            );

            min-height: 100vh;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

        }


        .card-custom {

            border: none;

            border-radius: 1.25rem;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.3);

            background: rgba(255, 255, 255, 0.98);

        }


        .title-brand {

            color: var(--purple-primary);

            font-weight: 800;

            letter-spacing: -0.5px;

        }


        .form-control:focus {

            border-color:
                var(--purple-accent);

            box-shadow:
                0 0 0 0.25rem
                rgba(168, 85, 247, 0.25);

        }


        .btn-purple {

            background:
                linear-gradient(
                    135deg,
                    var(--purple-secondary),
                    var(--purple-primary)
                );

            color: white;

            border: none;

            font-weight: 600;

            transition: all 0.3s ease;

        }


        .btn-purple:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--purple-primary),
                    var(--purple-gradient-start)
                );

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(107, 33, 168, 0.4);

        }


        .login-link {

            color: var(--purple-primary);

            font-weight: 600;

            text-decoration: none;

        }


        .login-link:hover {

            color: var(--purple-accent);

            text-decoration: underline;

        }


    </style>

</head>


<body>


    <div class="
        container
        min-vh-100
        d-flex
        align-items-center
        justify-content-center
        py-4
    ">


        <div class="row w-100 justify-content-center">


            <div class="
                col-12
                col-sm-10
                col-md-8
                col-lg-6
                col-xl-5
            ">


                <div class="card card-custom p-3 p-md-4">


                    <div class="card-body p-3">


                        <!-- LOGO -->

                        <div class="text-center mb-4">

                            <div class="mb-3">

                                <img
                                    src="/logo-akari.png"
                                    alt="Logo Akari Store"
                                    class="img-fluid"
                                    style="max-height: 90px;">

                            </div>


                            <h2 class="title-brand mb-1">

                                Crear cuenta

                            </h2>


                            <p class="text-muted small mb-0">

                                Regístrate en Akari Store

                            </p>

                        </div>


                        <!-- FORMULARIO -->

                        <form id="frmRegistro">


                            <!-- NOMBRE -->

                            <div class="mb-3">

                                <label
                                    for="txtNombre"
                                    class="form-label fw-medium">

                                    <i class="
                                        fas fa-user
                                        me-1
                                    "></i>

                                    Nombre completo

                                </label>


                                <input
                                    type="text"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtNombre"
                                    placeholder="Ingrese su nombre"
                                    required>

                            </div>


                            <!-- USUARIO -->

                            <div class="mb-3">

                                <label
                                    for="txtUsuario"
                                    class="form-label fw-medium">

                                    <i class="
                                        fas fa-user-circle
                                        me-1
                                    "></i>

                                    Usuario

                                </label>


                                <input
                                    type="text"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtUsuario"
                                    placeholder="Cree un usuario"
                                    required>

                            </div>


                            <!-- CONTRASEÑA -->

                            <div class="mb-3">

                                <label
                                    for="txtContrasena"
                                    class="form-label fw-medium">

                                    <i class="
                                        fas fa-lock
                                        me-1
                                    "></i>

                                    Contraseña

                                </label>


                                <input
                                    type="password"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtContrasena"
                                    placeholder="Cree una contraseña"
                                    required>

                            </div>


                            <!-- CONFIRMAR CONTRASEÑA -->

                            <div class="mb-3">

                                <label
                                    for="txtConfirmar"
                                    class="form-label fw-medium">

                                    <i class="
                                        fas fa-lock
                                        me-1
                                    "></i>

                                    Confirmar contraseña

                                </label>


                                <input
                                    type="password"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtConfirmar"
                                    placeholder="Repita su contraseña"
                                    required>

                            </div>


                            <!-- MENSAJE -->

                            <div
                                id="divMensaje"
                                class="mb-3">
                            </div>


                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                class="
                                    btn
                                    btn-purple
                                    btn-lg
                                    w-100
                                    fs-6
                                    py-2
                                ">

                                <i class="
                                    fas fa-user-plus
                                    me-2
                                "></i>

                                Crear cuenta

                            </button>


                        </form>


                        <!-- REGRESAR AL LOGIN -->

                        <div
                            class="
                                text-center
                                mt-4
                                pt-3
                                border-top
                            ">

                            <p class="
                                mb-1
                                text-muted
                                small
                            ">

                                ¿Ya tienes una cuenta?

                            </p>


                            <a
                                href="/login.html"
                                class="login-link small">

                                <i class="
                                    fas fa-arrow-left
                                    me-1
                                "></i>

                                Volver al inicio de sesión

                            </a>

                        </div>


                    </div>

                </div>


                <!-- FOOTER -->

                <p class="
                    text-center
                    text-white-50
                    mt-4
                    small
                ">

                    © 2026 Akari Store.
                    Todos los derechos reservados.

                </p>


            </div>

        </div>

    </div>


    <script>


        document.getElementById(
            "frmRegistro"
        ).onsubmit = function(e) {


            e.preventDefault();


            let nombre =
                document.getElementById(
                    "txtNombre"
                ).value;


            let usuario =
                document.getElementById(
                    "txtUsuario"
                ).value;


            let contrasena =
                document.getElementById(
                    "txtContrasena"
                ).value;


            let confirmar =
                document.getElementById(
                    "txtConfirmar"
                ).value;


            let mensaje =
                document.getElementById(
                    "divMensaje"
                );


            if (contrasena != confirmar) {

                mensaje.innerHTML = `

                    <div class="
                        alert
                        alert-danger
                        py-2
                        small
                    ">

                        Las contraseñas no coinciden.

                    </div>

                `;

                return;

            }


            let datos = {

                nombre: nombre,

                usuario: usuario,

                contrasena: contrasena

            };


            fetch("/registro", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(datos)

            })


            .then(response =>
                response.json()
            )


            .then(data => {


                if (data.estado) {


                    mensaje.innerHTML = `

                        <div class="
                            alert
                            alert-success
                            py-2
                            small
                        ">

                            ${data.mensaje}

                        </div>

                    `;


                    setTimeout(function() {

                        window.location.href =
                            "/login.html";

                    }, 1500);


                } else {


                    mensaje.innerHTML = `

                        <div class="
                            alert
                            alert-danger
                            py-2
                            small
                        ">

                            ${data.mensaje}

                        </div>

                    `;

                }

            })


            .catch(error => {


                mensaje.innerHTML = `

                    <div class="
                        alert
                        alert-danger
                        py-2
                        small
                    ">

                        No se pudo conectar
                        con el servidor.

                    </div>

                `;


                console.log(error);


            });

        };


    </script>


</body>

</html>
