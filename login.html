<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akari Store - Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        :root {

            --purple-primary: #6b21a8;

            --purple-secondary: #7e22ce;

            --purple-gradient-start: #4c1d95;

            --purple-gradient-end: #3b0764;

            --purple-accent: #a855f7;

        }


        body {

            background: linear-gradient(
                135deg,
                var(--purple-gradient-start),
                var(--purple-gradient-end)
            );

            min-height: 100vh;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

        }


        .card-custom {

            border: none;

            border-radius: 1.25rem;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.3);

            background: rgba(255, 255, 255, 0.98);

            backdrop-filter: blur(10px);

        }


 

        .logo-akari {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    padding: 6px;
    
    /* Fondo semi-transparente estilo glassmorphism */
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    
    /* Borde fino con degradado brillante */
    border: 2px solid rgba(168, 85, 247, 0.4);
    
    /* Sombra elegante con resplandor neón (glow) sutil */
    box-shadow: 
        0 10px 25px -5px rgba(107, 33, 168, 0.25),
        0 0 20px rgba(168, 85, 247, 0.2);
    
    /* Transición suave para todos los efectos */
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                box-shadow 0.4s ease, 
                border-color 0.4s ease;
}

.logo-akari:hover {
    
    transform: translateY(-4px) scale(1.04) rotate(2deg);
    
    border-color: var(--purple-accent);
    
    
    box-shadow: 
        0 15px 30px -5px rgba(107, 33, 168, 0.35),
        0 0 30px rgba(168, 85, 247, 0.45);
}

        .title-brand {

            color: var(--purple-primary);

            font-weight: 800;

            letter-spacing: -0.5px;

        }


        .form-control:focus {

            border-color: var(--purple-accent);

            box-shadow:
                0 0 0 0.25rem
                rgba(168, 85, 247, 0.25);

        }


        .btn-purple {

            background:
                linear-gradient(
                    135deg,
                    var(--purple-secondary),
                    var(--purple-primary)
                );

            color: white;

            border: none;

            font-weight: 600;

            transition: all 0.3s ease;

        }


        .btn-purple:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--purple-primary),
                    var(--purple-gradient-start)
                );

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(107, 33, 168, 0.4);

        }


        .btn-purple:active {

            transform: translateY(0);

        }


        .register-link {

            color: var(--purple-primary);

            font-weight: 600;

            text-decoration: none;

            transition: color 0.2s;

        }


        .register-link:hover {

            color: var(--purple-accent);

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <div class="
        container
        min-vh-100
        d-flex
        align-items-center
        justify-content-center
        py-4
    ">


        <div class="row w-100 justify-content-center">


            <div class="
                col-12
                col-sm-10
                col-md-7
                col-lg-5
                col-xl-4
            ">


                <div class="card card-custom p-3 p-md-4">


                    <div class="card-body p-3">


                     

                        <div class="text-center mb-4">

                            <div class="mb-3">

                                <img
                                    src="/img/logo-akari.jpg"
                                    alt="Logo Akari Store"
                                    class="logo-akari img-fluid">

                            </div>


                            <h2 class="title-brand mb-1">

                                Akari Store

                            </h2>


                            <p class="text-muted small mb-0">

                                Camisas personalizadas

                            </p>

                        </div>


                        <!-- FORMULARIO DE LOGIN -->

                        <form id="frmLogin">


                            <!-- USUARIO -->

                            <div class="mb-3">

                                <label
                                    for="txtUsuario"
                                    class="
                                        form-label
                                        text-dark
                                        fw-medium
                                        small
                                    ">

                                    <i class="
                                        fas
                                        fa-user
                                        me-1
                                    "></i>

                                    Usuario

                                </label>


                                <input
                                    type="text"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtUsuario"
                                    placeholder="Ingrese su usuario"
                                    required>

                            </div>


                            <!-- CONTRASEÑA -->

                            <div class="mb-3">

                                <label
                                    for="txtContrasena"
                                    class="
                                        form-label
                                        text-dark
                                        fw-medium
                                        small
                                    ">

                                    <i class="
                                        fas
                                        fa-lock
                                        me-1
                                    "></i>

                                    Contraseña

                                </label>


                                <input
                                    type="password"
                                    class="
                                        form-control
                                        form-control-lg
                                        fs-6
                                    "
                                    id="txtContrasena"
                                    placeholder="Ingrese su contraseña"
                                    required>

                            </div>


                            <!-- MENSAJE -->

                            <div
                                id="divMensaje"
                                class="mb-3">
                            </div>


                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                class="
                                    btn
                                    btn-purple
                                    btn-lg
                                    w-100
                                    fs-6
                                    py-2
                                ">

                                Iniciar sesión

                            </button>


                        </form>


                        <!-- REGISTRO -->

                        <div
                            class="
                                text-center
                                mt-4
                                pt-3
                                border-top
                            ">

                            <p class="
                                mb-0
                                text-muted
                                small
                            ">

                                ¿Necesitas una nueva cuenta?

                            </p>


                            <a
                                href="/registro.html"
                                class="register-link small">

                                <i class="
                                    fas
                                    fa-user-plus
                                    me-1
                                "></i>

                                Crear un nuevo usuario

                            </a>

                        </div>


                    </div>

                </div>


                <!-- FOOTER -->

                <p class="
                    text-center
                    text-white-50
                    mt-4
                    small
                ">

                    © 2026 Akari Store.
                    Todos los derechos reservados.

                </p>


            </div>

        </div>

    </div>


    <script>


        document.getElementById(
            "frmLogin"
        ).onsubmit = function(e) {


            e.preventDefault();


            let usuario =
                document.getElementById(
                    "txtUsuario"
                ).value;


            let contrasena =
                document.getElementById(
                    "txtContrasena"
                ).value;


            let datos = {

                usuario: usuario,

                contrasena: contrasena

            };


            fetch("/login", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(datos)

            })


            .then(response =>
                response.json()
            )


            .then(data => {


                let mensaje =
                    document.getElementById(
                        "divMensaje"
                    );


                if (data.estado) {


                    mensaje.innerHTML = `

                        <div class="
                            alert
                            alert-success
                            py-2
                            small
                        ">

                            ${data.mensaje}

                        </div>

                    `;


                    localStorage.setItem(
                        "usuario",
                        data.usuario
                    );


                    localStorage.setItem(
                        "rol",
                        data.rol
                    );


                    setTimeout(function() {

                        window.location.href =
                            "/index.html";

                    }, 1000);


                } else {


                    mensaje.innerHTML = `

                        <div class="
                            alert
                            alert-danger
                            py-2
                            small
                        ">

                            ${data.mensaje}

                        </div>

                    `;

                }

            })


            .catch(error => {


                document.getElementById(
                    "divMensaje"
                ).innerHTML = `

                    <div class="
                        alert
                        alert-danger
                        py-2
                        small
                    ">

                        No se pudo conectar
                        con el servidor.

                    </div>

                `;


                console.log(error);

            });

        };


    </script>


</body>

</html>
