<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades económicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form id="frmCliente" class="card p-4 shadow-sm">
                    <h4 class="card-title mb-3">Registro de Cliente</h4>
                    
                    <div class="mb-3">
                        <input pattern="^[0-9]{3,10}$" required placeholder="Código" name="txtCodigoCliente" id="txtCodigoCliente" class="form-control" type="text">
                    </div>
                    
                    <div class="mb-3">
                        <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre" name="txtNombreCliente" id="txtNombreCliente" class="form-control" type="text">
                    </div>
                    
                    <div class="mb-3">
                        <input placeholder="Dirección" name="txtDireccionCliente" id="txtDireccionCliente" class="form-control" type="text">
                    </div>
                    
                    <div class="mb-3">
                        <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Teléfono" name="txtTelefonoCliente" id="txtTelefonoCliente" class="form-control" type="text">
                    </div>
                    
                    <div class="mb-3">
                        <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente" class="form-control" type="email">
                    </div>
                    
                    <div class="mb-3">
                        <select class="form-select" name="cboTipoPersona" id="cboTipoPersona">
                            <option value="particular">Particular</option>
                            <option value="empresa">Empresa</option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <input type="submit" value="Guardar" class="btn btn-primary">
                        <input type="button" value="Buscar" class="btn btn-secondary">
                        <input type="reset" value="Limpiar" class="btn btn-warning">
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <!-- Aquí irán los datos o la tabla en el futuro -->
            </div>
        </div>
    </div>

    <script>
        var accion = 'nuevo',
            idCliente = '';

        frmCliente.addEventListener('submit', (e) => {
            e.preventDefault();
            guardarClientes();
        });

        frmCliente.addEventListener('reset', (e) => {
            e.preventDefault();
            limpiarFormulario();
        });

        async function guardarClientes() {
            let datos = {
                codigo: txtCodigoCliente.value,
                nombre: txtNombreCliente.value,
                direccion: txtDireccionCliente.value,
                telefono: txtTelefonoCliente.value,
                email: txtEmailCliente.value,
                tipo: cboTipoPersona.value,
                accion,
                idCliente
            };

            let response = await fetch('/cliente', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            });

            // Agregado el await que faltaba
            let respuesta = await response.json();

            if (respuesta.msg != "ok") {
                alert("Error: " + respuesta.msg);
                return;
            }
            limpiarFormulario();
        }

        function limpiarFormulario() {
            accion = 'nuevo';
            idCliente = '';
            txtCodigoCliente.value = '';
            txtNombreCliente.value = '';
            txtDireccionCliente.value = '';
            txtTelefonoCliente.value = '';
            txtEmailCliente.value = '';
            cboTipoPersona.value = 'particular';
        }
    </script>
</body>

</html>
