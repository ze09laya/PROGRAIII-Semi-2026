<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades económicas</title>
    
    <!-- CSS Alertify & Bootstrap -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- CSS jQuery UI (Necesario para arreglar draggable) -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">::.. SISTEMA DE IMPUESTOS A LAS ACTIVIDADES ECONÓMICAS ..::</a>
            <div class="collapse navbar-collapse" id="mnxImpuestos">
                <div class="navbar-nav">
                    <a class="nav-link" href="#" data-form="clientes">Clientes</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid position-relative">
        <div class="position-absolute" id="clientes"></div>
        <div class="position-absolute" id="busqueda_clientes"></div>
        <div class="position-absolute" id="productos"></div>
        <div class="position-absolute" id="busqueda_productos"></div>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mnxImpuestos = document.getElementById('mnxImpuestos');
            
            mnxImpuestos.addEventListener('click', e => {
                let form = e.target.dataset.form;
                if (form) {
                    e.preventDefault();
                    cargarForm(form);
                }
            });
        });

        function cargarForm(form, callback) {
            if ($(`#${form} > form`).length <= 0) {
                fetch(`/vistas?form=${form}`)
                    .then(response => {
                        if (!response.ok) throw new Error("No se pudo cargar la vista");
                        return response.text();
                    })
                    .then(ventana => {
                        $(`#${form}`).html(ventana).draggable();
                        cerrarVentana();
                        if (callback) callback();
                    })
                    .catch(error => console.error('Error al cargar el formulario:', error));
            } else {
                $(`#${form}`).show();
            }
        }

        function cerrarVentana() {
            $('.btn-close').off('click').on('click', function(e) {
                e.preventDefault();
                let form = $(this).data('form');
                if (form) {
                    $(`#${form}`).hide();
                }
            });
        }
    </script>
</body>
</html>
