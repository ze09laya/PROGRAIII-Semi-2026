
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python como backend</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Formulario -->
            <div class="col-6">
                <div class="container text-center">

                    <!-- Código -->
                    <div class="row mb-2">
                        <div class="col">
                            <input
                                placeholder="Codigo"
                                name="txtCodigoCliente"
                                id="txtCodigoCliente"
                                class="form-control"
                                type="text">
                        </div>
                    </div>

                    <!-- Nombre -->
                    <div class="row mb-2">
                        <div class="col">
                            <input
                                placeholder="Nombre"
                                name="txtNombreCliente"
                                id="txtNombreCliente"
                                class="form-control"
                                type="text">
                        </div>
                    </div>

                    <!-- Dirección -->
                    <div class="row mb-2">
                        <div class="col">
                            <input
                                placeholder="Direccion"
                                name="txtDireccionCliente"
                                id="txtDireccionCliente"
                                class="form-control"
                                type="text">
                        </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="row mb-2">
                        <div class="col">
                            <input
                                placeholder="Telefono"
                                name="txtTelefonoCliente"
                                id="txtTelefonoCliente"
                                class="form-control"
                                type="text">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="row mb-2">
                        <div class="col">
                            <input
                                placeholder="Email"
                                name="txtEmailCliente"
                                id="txtEmailCliente"
                                class="form-control"
                                type="text">
                        </div>
                    </div>

                    <!-- Tipo de persona -->
                    <div class="row mb-2">
                        <div class="col">
                            <select
                                class="form-control"
                                name="cboTipoPersona"
                                id="cboTipoPersona">

                                <option value="particular">Particular</option>
                                <option value="empresa">Empresa</option>

                            </select>
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="row mt-3">
                        <div class="col">
                            <input
                                type="button"
                                value="Guardar"
                                class="btn btn-primary">

                            <input
                                type="button"
                                value="Buscar"
                                class="btn btn-secondary">

                            <input
                                type="button"
                                value="Limpiar"
                                class="btn btn-warning">
                        </div>
                    </div>

                </div>
            </div>

            <!-- Segunda columna -->
            <div class="col-6">
            </div>

        </div>
    </div>

</body>

</html>
