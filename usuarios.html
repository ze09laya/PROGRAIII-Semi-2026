<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - USSS003725</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 16px 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.3rem;
            color: #ffffff !important;
            letter-spacing: -0.5px;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
            padding: 24px;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            background-color: #ffffff;
        }
        .table thead th {
            background: #1a202c;
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 16px;
        }
        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
        }
        .btn-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-green:hover {
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .btn-dark {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-dark:hover {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            transform: translateY(-1px);
        }
        .modal-content {
            border-radius: 16px;
            border: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom d-flex justify-content-between align-items-center mb-4">
        <span class="navbar-brand">Panel de Control (USSS003725)</span>
        <div class="d-flex align-items-center gap-3">
            <a href="/logout" class="btn btn-outline-light btn-sm px-3">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4 align-items-center g-3">
            <div class="col-md-8">
                <form method="GET" action="/usuarios" class="d-flex gap-2">
                    <input type="text" name="q" class="form-control" placeholder="Buscar por nombre o usuario..." value="{{query}}">
                    <button class="btn btn-dark px-4" type="submit">Buscar</button>
                </form>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-green px-4 py-2 w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#modalUsuario" onclick="limpiarFormulario()">+ Nuevo Usuario</button>
            </div>
        </div>

        <div class="card card-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre Completo</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{filas_usuarios}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Registro y Edición -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form method="POST" action="/guardar">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title fw-bold" id="modalLabel">Gestión de Usuario</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="idUsuario" name="idUsuario">

                        <div class="mb-3">
                            <label for="form_usuario" class="form-label fw-semibold">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="form_usuario" name="usuario" required maxlength="35">
                        </div>

                        <div class="mb-3">
                            <label for="form_clave" class="form-label fw-semibold">Contraseña / Clave</label>
                            <input type="password" class="form-control" id="form_clave" name="clave" placeholder="Dejar en blanco si no desea cambiarla" maxlength="35">
                        </div>

                        <div class="mb-3">
                            <label for="form_nombre" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="form_nombre" name="nombre" required maxlength="85">
                        </div>

                        <div class="mb-3">
                            <label for="form_direccion" class="form-label fw-semibold">Dirección</label>
                            <input type="text" class="form-control" id="form_direccion" name="dirección" maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="form_telefono" class="form-label fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="form_telefono" name="teléfono" maxlength="9">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-dark px-4">Guardar Datos</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function limpiarFormulario() {
            document.getElementById('modalLabel').innerText = 'Registrar Nuevo Usuario';
            document.getElementById('idUsuario').value = '';
            document.getElementById('form_usuario').value = '';
            document.getElementById('form_clave').value = '';
            document.getElementById('form_nombre').value = '';
            document.getElementById('form_direccion').value = '';
            document.getElementById('form_telefono').value = '';
        }

        function editarUsuario(id, usuario, nombre, direccion, telefono) {
            document.getElementById('modalLabel').innerText = 'Editar Usuario #' + id;
            document.getElementById('idUsuario').value = id;
            document.getElementById('form_usuario').value = usuario;
            document.getElementById('form_clave').value = ''; 
            document.getElementById('form_nombre').value = nombre;
            document.getElementById('form_direccion').value = direccion === 'None' ? '' : direccion;
            document.getElementById('form_telefono').value = telefono === 'None' ? '' : telefono;
        }
    </script>
</body>
</html>
